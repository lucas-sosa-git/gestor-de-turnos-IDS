<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Peluquería Elegance</title>
    <link rel="icon" href="{{ url_for('static', filename='css/tijeras.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elegance.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('inicio') }}">
                Peluquería Elegance
            </a>
        </div>
    </nav>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand-icon" aria-hidden="true">PE</div>

            <div class="login-header">
                <p class="eyebrow">Peluquería Elegance</p>
                <h1 id="login-title">Iniciar sesión</h1>
                <p class="subtitle">Ingrese con su cuenta para gestionar sus turnos y servicios.</p>
            </div>

            {% if error %}
                <p class="alert" role="alert">{{ error }}</p>
            {% endif %}

            {% if exito %}
                <p class="success" role="status">{{ exito }}</p>
            {% endif %}

            <form method="post" class="login-form">
                {% if next_url %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                {% endif %}

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="usuario@peluqueriaelegance.com"
                        required
                    >
                </div>

                <div class="field">
                    <label for="clave">Contraseña</label>
                    <input
                        id="clave"
                        name="clave"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <p class="form-link">
                <a href="{{ url_for('register') }}">Registrarse</a>
            </p>
        </section>
    </main>
    <footer>
        © 2026 Peluquería Elegance
    </footer>
</body>
</html>
