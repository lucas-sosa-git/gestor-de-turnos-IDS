<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barberia FIUBA</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f2f2f2; margin: 0;">
    <main style="min-height: 100vh; display: flex; justify-content: center; align-items: center;">
        <form style="background: white; padding: 25px; width: 300px; border: 1px solid #ddd;">
            <h1 style="font-size: 24px; margin-top: 0; text-align: center;">Barberia FIUBA</h1>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" style="width: 100%; margin: 8px 0 15px; padding: 8px;">

            <label for="password">Contrasena</label>
            <input id="password" name="password" type="password" style="width: 100%; margin: 8px 0 15px; padding: 8px;">

            <button type="submit" style="width: 100%; padding: 10px; background: #222; color: white; border: 0;">
                Ingresar
            </button>
        </form>
    </main>
</body>
</html>
