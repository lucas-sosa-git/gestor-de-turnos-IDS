<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Salon Elegance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand-icon" aria-hidden="true">SE</div>

            <div class="login-header">
                <p class="eyebrow">Salon Elegance</p>
                <h1 id="login-title">Iniciar sesion</h1>
                <p class="subtitle">Ingresa con tu cuenta para gestionar tus turnos y servicios.</p>
            </div>

            {% if error %}
                <p class="alert" role="alert">{{ error }}</p>
            {% endif %}

            <form method="post" class="login-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="usuario@salonelegance.com"
                        required
                    >
                </div>

                <div class="field">
                    <label for="clave">Contrasena</label>
                    <input
                        id="clave"
                        name="clave"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Tu contrasena"
                        required
                    >
                </div>

                <button type="submit">Ingresar</button>
            </form>
        </section>
    </main>
</body>
</html>
