<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>
        Peluquería Elegance
    </title>
    <link rel="icon" 
    href="{{ url_for('static', filename='css/tijeras.png') }}">

    <!-- Bootstrap -->
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            Peluquería Elegance
        </a>
        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse"
            id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/servicios">
                        Servicios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#reservas">
                        Reservas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contacto">
                        Contacto
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('register') }}">
                        Registrarse
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('login') }}">
                        Iniciar Sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<main>
    {% block content %}
    {% endblock %}
    <section class="hero">
        <h1>
            Peluquería Elegance
        </h1>
        <p>
            Reservá tu turno online de forma rápida y sencilla
        </p>

        <!-- FORMULARIO -->
        <form id="reservas">
            <h2>
                Reservá tu turno
            </h2>
            <div class="form_input">
                <input 
                type="text"
                placeholder="Nombre completo">
            </div>
            <div class="form_input">
                <input 
                type="tel"
                placeholder="Teléfono">
            </div>
            <div class="form_input">
                <input 
                type="email"
                placeholder="Email">
            </div>
            <div class="form_input">
                <textarea
                placeholder="Deja aquí tu mensaje..."></textarea>
            </div>
            <div class="form_input">
                <button type="submit">
                    Enviar
                </button>
            </div>
        </form>
    </section>

</main>

<footer>
    <p>
        © 2026 Peluquería Elegance
    </p>
    <p>
        Instagram | WhatsApp | Facebook
    </p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
