<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='css/tijeras.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resenias.css') }}">
    <title>Dejar Reseña</title>
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1 class="salon-title">Calificá tu turno</h1>
    </header>

    <div class="reserva-card resenia-card">
        <form id="formResenia">
            <input type="hidden" id="id_usuario" value="{{ id_usuario }}">
            <input type="hidden" id="id_cita" value="{{ id_cita }}">
            <input type="hidden" id="id_barbero" value="{{ id_barbero }}">

            <div class="form-group">
                <label class="form-label">Calificación (1 a 5 estrellas):</label>
                <select id="calificacion" class="form-select" required>
                    <option value="" disabled selected>Elegí un puntaje...</option>
                    <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
                    <option value="4">⭐⭐⭐⭐ - Muy Bueno</option>
                    <option value="3">⭐⭐⭐ - Bueno</option>
                    <option value="2">⭐⭐ - Regular</option>
                    <option value="1">⭐ - Malo</option>
                </select>
            </div>

            <div class="form-group-textarea">
                <label class="form-label">Comentario (Opcional):</label>
                <textarea id="comentario" class="form-textarea" rows="4" placeholder="¿Cómo fue tu experiencia?"></textarea>
            </div>

            <button type="submit" class="btn-enviar">
                Enviar Reseña
            </button>
        </form>

        <p id="mensaje" class="form-mensaje"></p>
    </div>
</div>
<script>
document.getElementById("formResenia").addEventListener("submit", async function(e){
    e.preventDefault();
    
    const mensajeEl = document.getElementById("mensaje");
    mensajeEl.innerText = "Enviando reseña...";
    mensajeEl.style.color = "#1f2937";

    const payload = {
        id_usuario: parseInt(document.getElementById("id_usuario").value),
        id_cita: parseInt(document.getElementById("id_cita").value),
        id_barbero: parseInt(document.getElementById("id_barbero").value),
        calificacion: parseInt(document.getElementById("calificacion").value),
        comentario: document.getElementById("comentario").value.trim()
    };

    try {
        const respuesta = await fetch("{{ url_for('crear_resenia_proxy') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
            mensajeEl.innerText = "¡Gracias por tu opinión! Redireccionando...";
            mensajeEl.style.color = "#16a34a";
            
            // Redirige al perfil del cliente o al historial de turnos
            setTimeout(() => {
                window.location.href = `/clientes/${payload.id_usuario}`; 
            }, 2000);
        } else {
            mensajeEl.innerText = "Error: " + (data.error || "No se pudo enviar la reseña.");
            mensajeEl.style.color = "#dc2626";
        }
    } catch (error) {
        mensajeEl.innerText = "Error de red o servidor no disponible.";
        mensajeEl.style.color = "#dc2626";
        console.error(error);
    }
});
</script>
</body>
</html>
