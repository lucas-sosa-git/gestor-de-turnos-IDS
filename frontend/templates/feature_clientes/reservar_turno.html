<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Turno - Peluqueria Elegance</title>
    <link rel="icon" href="{{ url_for('static', filename='css/tijeras.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elegance.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-row">
            <a class="navbar-brand" href="{{ url_for('clientes_panel', id_usuario=id_usuario) }}">
                Peluqueria Elegance
            </a>
        </div>
    </nav>

    <main class="reserve-page">
        <section class="reserve-card" aria-labelledby="reserva-title">
            <div class="brand-icon" aria-hidden="true">PE</div>
            <div class="reserve-header">
                <p class="eyebrow">Nueva reserva</p>
                <h1 id="reserva-title">Reservar turno</h1>
                <p class="subtitle">Elegi servicio, fecha y horario para confirmar tu cita.</p>
            </div>

            {% if error %}
                <p class="alert" role="alert">{{ error }}</p>
            {% endif %}

            <form method="post" class="login-form">
                <div class="field">
                    <label for="id_servicio">Servicio</label>
                    <select id="id_servicio" name="id_servicio" required>
                        <option value="">Selecciona un servicio</option>
                        {% for servicio in servicios %}
                            <option value="{{ servicio['id_servicio'] }}" data-duracion="{{ servicio['duracion'] }}">
                                {{ servicio['nombre'] }} - {{ servicio['duracion'] }} min
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" min="{{ fecha_min }}" required>
                    <p class="field-hint" id="fecha-legible">Selecciona una fecha.</p>
                </div>

                <div class="field">
                    <label for="hora_inicio">Hora</label>
                    <select id="hora_inicio" name="hora_inicio" required disabled>
                        <option value="">Selecciona servicio y fecha</option>
                    </select>
                    <p class="field-hint" id="horario-ayuda">Los horarios se muestran segun la disponibilidad del barbero.</p>
                </div>

                <button type="submit" class="btn-primary">
                    Confirmar Reserva
                </button>
            </form>

            <p class="form-link">
                <a href="{{ url_for('clientes_barberos', id_usuario=id_usuario) }}">Elegir otro peluquero</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Peluqueria Elegance</p>
    </footer>

    <script>
        const disponibilidad = {{ disponibilidad | tojson }};
        const citasOcupadas = {{ citas_ocupadas | tojson }};
        const fechaMinima = "{{ fecha_min }}";
        const servicioSelect = document.getElementById("id_servicio");
        const fechaInput = document.getElementById("fecha");
        const horaSelect = document.getElementById("hora_inicio");
        const fechaLegible = document.getElementById("fecha-legible");
        const horarioAyuda = document.getElementById("horario-ayuda");

        function minutos(hora) {
            const partes = String(hora || "").split(":").map(Number);
            return (partes[0] * 60) + partes[1];
        }

        function horaDesdeMinutos(total) {
            const horas = String(Math.floor(total / 60)).padStart(2, "0");
            const mins = String(total % 60).padStart(2, "0");
            return `${horas}:${mins}`;
        }

        function fechaArgentina(fechaIso) {
            if (!fechaIso) {
                return "Selecciona una fecha.";
            }

            const [anio, mes, dia] = fechaIso.split("-");
            return `Fecha seleccionada: ${dia}/${mes}/${anio}`;
        }

        function diaSemanaBd(fechaIso) {
            const fecha = new Date(`${fechaIso}T00:00:00`);
            return fecha.getDay();
        }

        function estaOcupado(fechaIso, inicio, fin) {
            const inicioMin = minutos(inicio);
            const finMin = minutos(fin);

            return citasOcupadas.some((cita) => {
                if (cita.fecha !== fechaIso || ["cancelada", "completada"].includes(cita.estado)) {
                    return false;
                }

                return minutos(cita.hora_inicio) < finMin && minutos(cita.hora_fin) > inicioMin;
            });
        }

        function yaPaso(fechaIso, inicio) {
            if (fechaIso !== fechaMinima) {
                return false;
            }

            const ahora = new Date();
            const minutosAhora = (ahora.getHours() * 60) + ahora.getMinutes();
            return minutos(inicio) <= minutosAhora;
        }

        function actualizarHorarios() {
            const opcionServicio = servicioSelect.selectedOptions[0];
            const duracion = Number(opcionServicio?.dataset.duracion || 0);
            const fechaIso = fechaInput.value;

            fechaLegible.textContent = fechaArgentina(fechaIso);
            horaSelect.innerHTML = "";

            if (!duracion || !fechaIso) {
                horaSelect.disabled = true;
                horaSelect.innerHTML = '<option value="">Selecciona servicio y fecha</option>';
                horarioAyuda.textContent = "Los horarios se muestran segun la disponibilidad del barbero.";
                return;
            }

            const dia = diaSemanaBd(fechaIso);
            const bloques = disponibilidad.filter((bloque) => Number(bloque.dia_semana) === dia);
            const opciones = [];

            bloques.forEach((bloque) => {
                const desde = minutos(bloque.hora_inicio);
                const hasta = minutos(bloque.hora_fin);

                for (let inicio = desde; inicio + duracion <= hasta; inicio += 15) {
                    const hora = horaDesdeMinutos(inicio);
                    const fin = horaDesdeMinutos(inicio + duracion);

                    if (!estaOcupado(fechaIso, hora, fin) && !yaPaso(fechaIso, hora)) {
                        opciones.push(hora);
                    }
                }
            });

            if (!opciones.length) {
                horaSelect.disabled = true;
                horaSelect.innerHTML = '<option value="">No hay horarios disponibles</option>';
                horarioAyuda.textContent = "Ese dia no tiene horarios libres para el servicio elegido.";
                return;
            }

            horaSelect.disabled = false;
            horaSelect.innerHTML = '<option value="">Selecciona un horario</option>';
            opciones.forEach((hora) => {
                const option = document.createElement("option");
                option.value = hora;
                option.textContent = `${hora} hs`;
                horaSelect.appendChild(option);
            });
            horarioAyuda.textContent = "Estos horarios respetan la agenda configurada del barbero.";
        }

        servicioSelect.addEventListener("change", actualizarHorarios);
        fechaInput.addEventListener("change", actualizarHorarios);
        actualizarHorarios();
    </script>
</body>
</html>
