<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelacion de turno - Peluqueria Elegance</title>
    <link rel="icon" href="{{ url_for('static', filename='css/tijeras.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elegance.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-row">
            <a class="navbar-brand" href="{{ url_for('inicio') }}">Peluqueria Elegance</a>
        </div>
    </nav>

    <main class="reserve-page">
        <section class="reserve-card" aria-labelledby="cancelacion-title">
            <div class="brand-icon" aria-hidden="true">PE</div>
            <div class="reserve-header">
                <p class="eyebrow">Reserva</p>
                <h1 id="cancelacion-title">
                    {% if ok is defined and not ok %}No se pudo cancelar{% else %}Turno cancelado{% endif %}
                </h1>
                <p class="{% if ok is defined and not ok %}alert{% else %}success{% endif %}" role="status">
                    {{ mensaje or "Tu reserva fue cancelada correctamente." }}
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Peluqueria Elegance</p>
    </footer>
</body>
</html>
