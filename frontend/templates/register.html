<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Barbería FIUBA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="register-title">
            <div class="brand-icon" aria-hidden="true">SE</div>

            <div class="login-header">
                <p class="eyebrow">Salon Elegance</p>
                <h1 id="register-title">Crear cuenta</h1>
                <p class="subtitle">Ingresá tus datos para crear una cuenta.</p>
            </div>

            {% if error %}
                <p class="alert" role="alert">{{ error }}</p>
            {% endif %}

            <form method="post" class="login-form">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        autocomplete="name"
                        placeholder="Tu nombre"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="usuario@salonelegance.com"
                        required
                    >
                </div>

                <div class="field">
                    <label for="clave">Contraseña</label>
                    <input
                        id="clave"
                        name="clave"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Tu contraseña"
                        required
                    >
                </div>

                <button type="submit">Crear cuenta</button>
            </form>
        </section>
    </main>
</body>
</html>
