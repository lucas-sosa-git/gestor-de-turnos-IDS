<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Peluquería Elegance</title>
    <link rel="icon" href="{{ url_for('static', filename='css/tijeras.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elegance.css') }}">
    
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('inicio') }}">
                Peluquería Elegance
            </a>
        </div>
    </nav>
    <main class="login-page">
        <section class="login-card" aria-labelledby="register-title">
            <div class="brand-icon" aria-hidden="true">PE</div>

            <div class="login-header">
                <p class="eyebrow">Peluquería Elegance</p>
                <h1 id="register-title">Crear cuenta</h1>
                <p class="subtitle">Ingrese sus datos para crear una cuenta.</p>
            </div>

            {% if error %}
                <p class="alert" role="alert">{{ error }}</p>
            {% endif %}

            <form method="post" class="login-form">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        autocomplete="name"
                        placeholder="Nombre completo"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="usuario@peluqueriaelegance.com"
                        required
                    >
                </div>

                <div class="field">
                    <label for="clave">Contraseña</label>
                    <input
                        id="clave"
                        name="clave"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Contraseña"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">Crear cuenta</button>
            </form>

            <p class="form-link">
                <a href="{{ url_for('login') }}">Iniciar sesión</a>
            </p>
        </section>
    </main>
    <footer>
        <p>© 2026 Peluquería Elegance</p>
    </footer>
</body>
</html>
